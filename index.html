<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Construction</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    .card {
      padding: 20px;
      max-width: 500px;
    }

    img {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .buttons {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    a.button {
      display: block;
      padding: 12px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      font-weight: bold;
      transition: 0.2s;
    }

    .fb { background: #1877f2; }
    .fb:hover { background: #0f5bd3; }

    .wa { background: #25D366; }
    .wa:hover { background: #1da851; }

    .vb { background: #7360f2; }
    .vb:hover { background: #5a49c9; }
  </style>
</head>

<body>

  <div class="card">

    <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/Under_construction_icon-orange.png" alt="Under Construction">

    <div class="buttons">

      <a class="button fb" href="https://www.facebook.com/jordansseabreezestudioneakarvalikavalas" target="_blank">
        Facebook Page
      </a>

      <a class="button wa" href="https://wa.me/306932728683" target="_blank">
        WhatsApp
      </a>

      <a class="button vb" href="viber://chat?number=%2B306932728683">
        Viber
      </a>

    </div>

  </div>

</body>
</html>
