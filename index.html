<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Now</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial, sans-serif;
      background:#0b1220;
      color:#fff;
      text-align:center;
    }

    .card{
      width:90%;
      max-width:420px;
    }

    img{
      width:100%;
      border-radius:12px;
      margin-bottom:20px;
      box-shadow:0 10px 30px rgba(0,0,0,0.5);
    }

    h1{
      margin:10px 0 20px;
      font-size:32px;
      letter-spacing:1px;
    }

    .top-buttons{
      display:flex;
      gap:10px;
      margin-bottom:15px;
    }

    .btn{
      flex:1;
      padding:12px;
      border-radius:10px;
      text-decoration:none;
      font-weight:bold;
      color:white;
      display:block;
      transition:0.2s;
    }

    .wa{ background:#25D366; }
    .wa:hover{ background:#1da851; }

    .vb{ background:#7360f2; }
    .vb:hover{ background:#5a49c9; }

    .fb{
      background:#1877f2;
    }

    .fb:hover{
      background:#0f5bd3;
    }

    .fb-title{
      margin-top:15px;
      font-size:16px;
      opacity:0.9;
    }
  </style>
</head>

<body>

  <div class="card">

    <img src="images/under-construction.jpg" alt="Jordan's Sea Breeze Studio to Nea Karvali Kavalas is Under Construction">

    <h1>Book now</h1>

    <div class="top-buttons">
      <a class="btn wa" href="https://wa.me/306932728683" target="_blank">WhatsApp</a>
      <a class="btn vb" href="viber://chat?number=%2B306932728683">Viber</a>
    </div>

    <div class="fb-title">Find us and stay connected</div>

    <a class="btn fb" href="https://facebook.com" target="_blank">
      Facebook Page
    </a>

  </div>

</body>
</html>
